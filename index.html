<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Red — Đăng nhập Discord</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body {
    min-height:100vh; background:#0a0a0a; color:#fff;
    display:flex; align-items:center; justify-content:center; padding:1rem;
  }
  .box {
    background:#111; border-radius:2rem; padding:3rem 2rem;
    width:100%; max-width:420px; border:1px solid #ff3b3b;
    box-shadow:0 0 25px rgba(255,0,0,.5), 0 0 60px rgba(255,0,0,.2);
    text-align:center; transition:box-shadow .25s ease;
  }
  .box:hover { box-shadow:0 0 40px rgba(255,0,0,.8), 0 0 80px rgba(255,0,0,.35); }
  .title {
    font-size:2rem; font-weight:700; letter-spacing:3px;
    text-transform:uppercase; margin-bottom:.5rem;
    text-shadow:0 0 6px #f00, 0 0 18px rgba(255,0,0,.7);
  }
  .sub {
    color:#ff9999; font-size:.85rem; letter-spacing:1px;
    margin-bottom:2.5rem; text-transform:uppercase; opacity:.8;
  }
  .logo {
    width:90px; height:90px; margin:0 auto 2rem;
    background:#ff1a1a; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 25px #ff1a1a, 0 0 50px rgba(255,0,0,.5);
    transition:box-shadow .3s ease, transform .3s ease;
  }
  .logo:hover { box-shadow:0 0 35px #ff1a1a, 0 0 70px rgba(255,0,0,.8); transform:scale(1.05); }
  .logo svg { width:50px; height:50px; fill:#fff; }
  .btn {
    width:100%; padding:1rem 1.2rem; background:transparent;
    border:2px solid #ff1a1a; border-radius:12px; color:#fff;
    font-size:1.05rem; font-weight:700; letter-spacing:1.5px;
    cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:.8rem;
    box-shadow:0 0 12px rgba(255,26,26,.6), inset 0 0 8px rgba(255,26,26,.3);
    text-shadow:0 0 6px rgba(255,0,0,.8);
    transition:background .2s ease, color .2s ease, box-shadow .25s ease, transform .2s ease;
    will-change:transform, box-shadow;
  }
  .btn:hover {
    background:#ff1a1a; color:#0a0a0a; transform:translateY(-2px);
    box-shadow:0 0 22px #ff1a1a, 0 0 45px rgba(255,0,0,.6);
    text-shadow:none;
  }
  .btn:hover svg { fill:#0a0a0a; }
  .btn:active { transform:translateY(0); }
  .btn svg { width:24px; height:24px; fill:#fff; transition:fill .2s ease; flex-shrink:0; }
  .hint {
    color:#666; font-size:.8rem; margin-top:1.8rem;
    letter-spacing:.5px; line-height:1.5;
  }
  .hint span { color:#ff4d4d; font-weight:600; }
  .code-box {
    margin-top:1.5rem; padding:1rem; border-radius:10px;
    background:rgba(255,0,0,.1); border:1px solid #ff4d4d;
    color:#ffb3b3; font-family:monospace; font-size:.85rem;
    word-break:break-all; text-align:left; display:none;
  }
  .code-box.show { display:block; animation:fadeIn .25s ease; }
  .code-box strong { color:#ff4d4d; display:block; margin-bottom:.4rem; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body>

<div class="box">
  <div class="logo">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
    </svg>
  </div>

  <h1 class="title">ĐĂNG NHẬP</h1>
  <div class="sub">Neon Red Edition</div>

  <button class="btn" id="discordBtn">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
    </svg>
    Sign in with Discord
  </button>

  <div class="hint">
    Hệ thống chỉ hỗ trợ đăng nhập qua <span>Discord</span>.
  </div>

  <div class="code-box" id="codeBox">
    <strong>✅ Đã nhận code từ Discord:</strong>
    <span id="codeValue"></span>
    <div style="margin-top:.6rem;color:#888;font-size:.75rem;">
      Code này cần gửi lên backend để đổi lấy thông tin user.
    </div>
  </div>
</div>

<script>
  // ============================================================
  //  ĐIỀN CLIENT ID CỦA BẠN VÀO ĐÂY
  //  (Client ID an toàn để public — KHÔNG phải secret)
  // ============================================================
  const DISCORD_CLIENT_ID = '1549389202217508914';

  // Redirect URI — PHẢI giống hệt cái bạn đã thêm trong Discord Portal
  // Nếu chạy local: http://localhost:5500
  // Nếu host thật: https://tenmiencuaban.com
  const DISCORD_REDIRECT_URI = window.location.origin + window.location.pathname;

  const btn = document.getElementById('discordBtn');
  const codeBox = document.getElementById('codeBox');
  const codeValue = document.getElementById('codeValue');

  // ===== Bấm nút → redirect sang Discord =====
  btn.addEventListener('click', () => {
    const params = new URLSearchParams({
      client_id: DISCORD_CLIENT_ID,
      redirect_uri: DISCORD_REDIRECT_URI,
      response_type: 'code',
      scope: 'identify email'
    });
    window.location.href = 'https://discord.com/api/oauth2/authorize' + params.toString(https://namdevxhub.github.io/-/);
  });

  // ===== Khi Discord redirect về với ?code=... =====
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  if (code) {
    codeBox.classList.add('show');
    codeValue.textContent = code;
    // Xóa code khỏi URL cho sạch (tránh lộ khi share link)
    window.history.replaceState({}, document.title, window.location.pathname);
  }
</script>

</body>
</html>
